<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="leaflet.css">
<style>html,body,#map{margin:0;height:100%}#map{background:#ddd}</style>
<div id="map"></div>
<script src="leaflet.js"></script>
<script>
  var q = new URLSearchParams(location.search);
  window.__birdmapPartialRetryMs = +(q.get('retry') || 60000);
  window.__recoveryDelays = q.get('rec') ? q.get('rec').split(',').map(Number) : null;
  try { localStorage.setItem('birdmap.basemap.preference', q.get('pref') || 'satellite'); } catch (_) {}
  document.write('<script src="' + (q.get('ctrl') || 'main') + '.js"><\/script>');
</script>
<script>
  var map = L.map('map').setView([36.3, 127.6], +(q.get('z') || 11));
  var osm = L.tileLayer('https://osm.test/{z}/{x}/{y}.png', { zIndex: 1 }).addTo(map);
  window.ctl = BirdmapBasemap.mount({ map: map, osm: osm, domesticBounds: [[32.9, 124.5], [38.75, 132.0]],
    config: { vworldMode: 'worker', vworldTileEndpoint: 'https://birdmap-vworld-tiles.birdmap-vworld-isolated.workers.dev/tiles' } });
  window.probe = function () {
    var r = document.getElementById('map').getBoundingClientRect(), z = map.getZoom(), out = { vis: 0, gray: 0, overlayVis: 0, overlayMissing: 0 };
    document.querySelectorAll('img.leaflet-tile').forEach(function (i) {
      var m = /\/tiles\/(satellite|hybrid)\/(\d+)\//.exec(i.src); if (!m || +m[2] !== z) return;
      var b = i.getBoundingClientRect(); if (b.right <= r.left || b.left >= r.right || b.bottom <= r.top || b.top >= r.bottom) return;
      var ok = i.classList.contains('leaflet-tile-loaded');
      if (m[1] === 'satellite') { if (ok) out.vis++; } else { if (ok) out.overlayVis++; }
    });
    // Tiles the view needs at this zoom; what is not loaded shows the grey container.
    var pb = map.getPixelBounds(), x0 = Math.floor(pb.min.x / 256), x1 = Math.floor((pb.max.x - 1) / 256), y0 = Math.floor(pb.min.y / 256), y1 = Math.floor((pb.max.y - 1) / 256);
    out.expected = (x1 - x0 + 1) * (y1 - y0 + 1);
    out.gray = out.expected - out.vis; out.overlayMissing = out.expected - out.overlayVis;
    out.state = ctl.getState(); out.osmOn = map.hasLayer(osm);
    return out;
  };
</script>
