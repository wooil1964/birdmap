# Reviewed candidate only. No deployment, secret upload, D1 or service binding.
name = "birdmap-vworld-tiles"
main = "src/worker.mjs"
compatibility_date = "2026-10-22"
workers_dev = true
preview_urls = false

[vars]
# Enable only in the separately approved rollout after account/quota checks.
TILES_ENABLED = "false"

[secrets]
required = ["VWORLD_API_KEY"]

# Proposed independent namespaces; check account-wide availability before rollout.
# Both counters are approximate and per Cloudflare location, not global quotas.
[[ratelimits]]
name = "CLIENT_TILE_LIMITER"
namespace_id = "196440"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "GLOBAL_TILE_LIMITER"
namespace_id = "196441"
simple = { limit = 6000, period = 60 }

[observability]
enabled = false
