name: Publication security regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      vworld_live_check:
        description: 'Only run the read-only VWorld secret probe (no deployment or artifacts)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: publication-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.vworld_live_check != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install shared card test dependencies
        run: |
          python -m pip install --quiet Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum
      - name: Require installed Chrome
        shell: bash
        run: |
          chrome=$(command -v google-chrome || command -v google-chrome-stable || true)
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
      - name: Front regression with actual Chrome
        run: node --test --test-reporter=tap .github/scripts/test_*.mjs
      - name: Island search pilot Chrome with synthetic API reads
        env:
          ISLAND_PILOT_OUTPUT: .ci-results/island-pilot
          ISLAND_PILOT_OSM_TILES: '0'
        run: node docs/island-nearby-pilot/browser.mjs
      - name: VWorld selection and fallback Chrome with synthetic tiles
        env:
          VWORLD_QA_OUTPUT: .ci-results/vworld-browser
        run: node docs/vworld-candidate/browser.mjs
      - name: Public and admin API and SQLite security
        working-directory: reports-api
        run: node --test --test-reporter=tap
      - name: Weather proxy
        run: node --test --test-reporter=tap weather-proxy/test/*.test.mjs
      - name: Python weather, tide and shared pages
        shell: bash
        run: |
          python .github/scripts/test_report_archive_contract.py
          python .github/scripts/test_island_nearby_contract.py
          python .github/scripts/test_central_sites.py
          python .github/scripts/test_jeju_sites.py
          python .github/scripts/test_metro_sites.py
          python .github/scripts/test_central_registry_append.py
          python .github/scripts/test_weather.py
          python .github/scripts/test_validator_time_contract.py
          python .github/scripts/test_tide.py
          python .github/scripts/test_share_pages.py
          python .github/scripts/build_seo_pages.py --check
          python .github/scripts/test_seo_pages.py
      - name: Exact normal recommendation signatures
        run: node .github/scripts/publication_ci_signatures.mjs . HEAD b12e20c1b6d856a021898a0c1c9221b30393a221
      - name: Chrome publication and consent security with local mock only
        env:
          PUBLICATION_TEST_OUTPUT: .ci-results/chrome
        run: node docs/p1-publication-final-audit/browser/publication_chrome_final_r4.mjs
      # Regression for run 38569301560: a slow CDN after Page.reload left a half-parsed page and
      # 19 checks failed at 1024px. Every dependency is delayed here; all checks must still pass.
      - name: Chrome publication security with slow dependencies (1024px)
        env:
          PUBLICATION_TEST_OUTPUT: .ci-results/chrome-slow-cdn
          PUBLICATION_TEST_WIDTHS: "1024"
          PUBLICATION_TEST_DEPENDENCY_DELAY_MS: "2500"
        run: node docs/p1-publication-final-audit/browser/publication_chrome_final_r4.mjs
      - name: Reporter lifetime statistics Chrome (synthetic only)
        env:
          PUBLICATION_TEST_OUTPUT: .ci-results/reporter
        run: node docs/reporter-lifetime-stats/browser/reporter_chrome.mjs
      - name: Field retirement and ordinary reports Chrome (current app)
        env:
          ISSUE28_OUTPUT: .ci-results/issue28-chrome
        run: node docs/field-news-retirement/chrome.mjs
      - name: Native local D1 atomic fence and CAS (synthetic only)
        shell: bash
        run: |
          npm install --prefix .ci-toolchain --no-save --package-lock=false --no-audit --no-fund miniflare@5.20261006.1-alpha
          mkdir -p .ci-results/native-fence .ci-results/native-cas
          node docs/central-sites-20261018/native-registry.mjs "$PWD/.ci-toolchain/node_modules"
          node docs/jeju-sites-20261018/native-registry.mjs "$PWD/.ci-toolchain/node_modules"
          node docs/jeju-sites-20261018/ops-local.mjs "$PWD/.ci-toolchain/node_modules"
          node docs/metro-sites-20261019/native-registry.mjs "$PWD/.ci-toolchain/node_modules"
          node docs/metro-sites-20261019/ops-local.mjs "$PWD/.ci-toolchain/node_modules"
          node docs/p1-paid-deployment/writer-fence-review/native_fence.mjs . .ci-results/native-fence "$PWD/.ci-toolchain/node_modules"
          node docs/p1-paid-deployment/writer-fence-review/native_cas_current.mjs . .ci-results/native-cas "$PWD/.ci-toolchain/node_modules"
          ISSUE28_OUTPUT=.ci-results/issue28-native node docs/issue28/native.mjs "$PWD/.ci-toolchain/node_modules"
      - name: Prepare protective Pages rollback artifact
        run: node .github/scripts/package_protected_pages.mjs .ci-results/protected-pages
      - name: Upload protective standby artifact (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: protected-pages-${{ github.sha }}
          path: .ci-results/protected-pages
          retention-days: 30
          if-no-files-found: error
      - name: Upload synthetic browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-security-diagnostics-${{ github.sha }}
          path: |
            .ci-results/chrome
            .ci-results/chrome-slow-cdn
            .ci-results/reporter
            .ci-results/native-fence
            .ci-results/native-cas
            .ci-results/issue28-chrome
            .ci-results/issue28-native
            .ci-results/island-pilot
            .ci-results/vworld-browser
          retention-days: 14
          if-no-files-found: ignore

  vworld-live-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.vworld_live_check == true && github.ref == 'refs/heads/review/vworld-default-keyless-20261021' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # No checkout, third-party action, cache, file output or artifact in this job.
      # Only this step can read the secret. Never print URLs, headers, bodies or exceptions.
      - name: Probe one WMTS tile with four Referer conditions
        env:
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        shell: python
        run: |
          import binascii, json, os, struct, sys, urllib.error, urllib.parse, urllib.request, zlib

          LIMIT = 2 * 1024 * 1024
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def image_info(body):
              # Validate image framing and dimensions in memory, without saving a tile.
              if body.startswith(b'\x89PNG\r\n\x1a\n'):
                  pos, width, height, ended, compressed = 8, 0, 0, False, bytearray()
                  try:
                      while pos + 12 <= len(body):
                          size = struct.unpack('>I', body[pos:pos+4])[0]
                          tag = body[pos+4:pos+8]
                          if size > LIMIT or pos + 12 + size > len(body):
                              return 'png', 0, 0, False
                          data = body[pos+8:pos+8+size]
                          crc = struct.unpack('>I', body[pos+8+size:pos+12+size])[0]
                          if binascii.crc32(tag + data) & 0xffffffff != crc:
                              return 'png', 0, 0, False
                          if pos == 8:
                              if tag != b'IHDR' or size != 13:
                                  return 'png', 0, 0, False
                              width, height = struct.unpack('>II', data[:8])
                          if tag == b'IDAT':
                              compressed.extend(data)
                          pos += 12 + size
                          if tag == b'IEND':
                              ended = size == 0 and pos == len(body)
                              break
                      decoder = zlib.decompressobj()
                      pixels = decoder.decompress(bytes(compressed), LIMIT + 1)
                      valid = ended and decoder.eof and not decoder.unconsumed_tail and not decoder.unused_data and 0 < len(pixels) <= LIMIT
                      return 'png', width, height, valid
                  except Exception:
                      return 'png', 0, 0, False
              if body.startswith(b'\xff\xd8'):
                  pos = 2
                  try:
                      while pos < len(body):
                          if body[pos] != 255:
                              break
                          while body[pos] == 255:
                              pos += 1
                          marker = body[pos]
                          pos += 1
                          if marker in (0xd8, 0x01) or 0xd0 <= marker <= 0xd7:
                              continue
                          if marker in (0xd9, 0xda):
                              break
                          size = struct.unpack('>H', body[pos:pos+2])[0]
                          if size < 2 or pos + size > len(body):
                              break
                          if marker in (0xc0, 0xc1, 0xc2):
                              height, width = struct.unpack('>HH', body[pos+3:pos+7])
                              return 'jpeg', width, height, body.endswith(b'\xff\xd9')
                          pos += size
                  except Exception:
                      pass
                  return 'jpeg', 0, 0, False
              if body.lstrip().startswith(b'<'):
                  return 'xml-or-html', 0, 0, False
              return 'other', 0, 0, False

          def main():
              key = os.environ.pop('VWORLD_API_KEY', '')
              if not key or len(key) > 512 or any(c.isspace() for c in key):
                  print('VWORLD_PROBE: missing-or-invalid-secret; no request made')
                  return 1
              # Exactly the candidate Base WMTS .png path. Extension is not format proof.
              target = 'https://api.vworld.kr/req/wmts/1.0.0/' + urllib.parse.quote(key, safe='') + '/Base/8/100/218.png'
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              scenarios = [('no_referer', None), ('registered_page_header', 'https://wooil1964.github.io/birdmap/'), ('registered_origin_header', 'https://wooil1964.github.io/'), ('unrelated_origin_header', 'https://birdmap-auth-negative.invalid/')]
              rows = []
              for name, referer in scenarios:
                  row = {'scenario': name, 'http': 0, 'mime': 'other', 'bytes': 0, 'format': 'other', 'width': 0, 'height': 0, 'image_header_valid': False, 'tile_image_response': False, 'result': 'transport-failure'}
                  headers = {'User-Agent': 'birdmap-readonly-vworld-probe/1.0', 'Accept': 'image/png,image/jpeg', 'Cache-Control': 'no-cache'}
                  if referer:
                      headers['Referer'] = referer
                  try:
                      request = urllib.request.Request(target, headers=headers, method='GET')
                      with opener.open(request, timeout=20) as response:
                          row['http'] = int(response.status)
                          mime = response.headers.get_content_type()
                          row['mime'] = mime if mime in ('image/png', 'image/jpeg', 'text/xml', 'application/xml', 'text/html', 'application/octet-stream') else 'other'
                          body = response.read(LIMIT + 1)
                          row['bytes'] = len(body)
                          if len(body) <= LIMIT:
                              fmt, width, height, valid = image_info(body)
                              row.update(format=fmt, width=width, height=height, image_header_valid=valid)
                              row['tile_image_response'] = row['http'] == 200 and valid and width == 256 and height == 256
                              row['result'] = 'image-response' if row['tile_image_response'] else 'non-tile-response'
                          else:
                              row['result'] = 'response-too-large'
                          body = b''
                  except urllib.error.HTTPError as error:
                      row['http'] = int(error.code)
                      row['result'] = 'http-rejected'
                      try:
                          mime = error.headers.get('Content-Type', '').partition(';')[0].strip().lower()
                          row['mime'] = mime if mime in ('image/png', 'image/jpeg', 'text/xml', 'application/xml', 'text/html', 'application/octet-stream') else 'other'
                          body = error.read(LIMIT + 1)
                          row['bytes'] = len(body)
                          if len(body) <= LIMIT:
                              fmt, width, height, valid = image_info(body)
                              row.update(format=fmt, width=width, height=height, image_header_valid=valid)
                          body = b''
                      except Exception:
                          pass
                      finally:
                          error.close()
                  except Exception:
                      pass
                  rows.append(row)
                  # Only whitelisted metadata, never arbitrary service strings.
                  print(json.dumps(row, sort_keys=True))
              origin_ok = rows[2]['tile_image_response']
              controls_no_tile = all(r['result'] in ('http-rejected', 'non-tile-response') for r in (rows[0], rows[3]))
              print(json.dumps({'registered_origin_server_probe': origin_ok, 'negative_controls_no_tile_observed': controls_no_tile, 'domain_restriction_verified': False, 'actual_pages_browser_auth': 'not-executed', 'pixel_rendering': 'not-executed', 'deployment': 'not-executed'}, sort_keys=True))
              # A missing tile on a negative control is not proof of auth enforcement.
              return 0 if origin_ok and controls_no_tile else 1

          try:
              result = main()
          except Exception:
              print('VWORLD_PROBE: internal-failure; details suppressed')
              result = 1
          sys.exit(result)
