name: Rebuild share pages

# 예약 실행 없음. 탐조지 이름·좌표·소개가 바뀐 뒤 Actions 탭에서 직접 실행한다.
# 작업 PC 에 Python·Pillow 가 없어도 원본 build_share_pages.py 를 그대로 돌리기 위한 통로다.
on:
  workflow_dispatch:

permissions:
  contents: write

# 기상·조석 갱신과 커밋이 겹치지 않도록 같은 그룹을 쓴다.
concurrency:
  group: birdmap-data-refresh
  cancel-in-progress: false

jobs:
  build-share-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 카드 이미지에 한글을 그리려면 build_share_pages.py 의 FONT_CANDIDATES 에 있는
      # 글꼴이 실제로 있어야 한다. 없으면 스크립트가 RuntimeError 로 멈춘다.
      - name: Install Pillow and a Korean font
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum
          fc-list | grep -i -E "notosanscjk|nanum" | head -3

      - name: Build share pages and preview cards
        run: python .github/scripts/build_share_pages.py

      - name: Verify share/ is in sync with siteData
        run: python .github/scripts/build_share_pages.py --check

      - name: Commit updated share pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share
          if git diff --cached --quiet; then
            echo "No share page changes to commit."
            exit 0
          fi
          # 카드 글꼴이 이전 생성 환경과 다르면 바뀐 탐조지 외의 PNG 까지 함께 바뀐다.
          # 몇 개가 바뀌었는지 로그에 남겨 의도치 않은 전량 재생성을 알아볼 수 있게 한다.
          echo "변경된 파일 수: $(git diff --cached --name-only | wc -l)"
          git diff --cached --stat | tail -20
          git commit -m "chore: rebuild share pages"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
