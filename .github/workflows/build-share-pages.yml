name: Rebuild share pages

# 예약 실행 없음. 탐조지 이름·좌표·소개가 바뀐 뒤 Actions 탭에서 직접 실행한다.
# 작업 PC 에 Python·Pillow 가 없어도 원본 build_share_pages.py 를 그대로 돌리기 위한 통로다.
on:
  workflow_dispatch:
    inputs:
      site_ids:
        description: "커밋할 탐조지 ID (공백으로 구분). 비우면 바뀐 파일을 모두 커밋한다."
        required: false
        default: "15 16 194"

permissions:
  contents: write

# 기상·조석 갱신과 커밋이 겹치지 않도록 같은 그룹을 쓴다.
concurrency:
  group: birdmap-data-refresh
  cancel-in-progress: false

jobs:
  build-share-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 카드 이미지에 한글을 그리려면 build_share_pages.py 의 FONT_CANDIDATES 에 있는
      # 글꼴이 실제로 있어야 한다. 없으면 스크립트가 RuntimeError 로 멈춘다.
      - name: Install Pillow and a Korean font
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum
          fc-list | grep -i -E "notosanscjk|nanum" | head -3

      - name: Build share pages and preview cards
        run: python .github/scripts/build_share_pages.py

      - name: Verify share/ is in sync with siteData
        run: python .github/scripts/build_share_pages.py --check

      # 생성은 전체를 하고 검증도 전체로 하되, 커밋은 지정한 ID 만 담는다.
      # 카드 글꼴이 이전 생성 환경(맑은 고딕)과 다르면 손대지 않은 탐조지의 PNG 까지
      # 다시 그려지므로, 그대로 두면 관계없는 카드가 함께 바뀐다.
      - name: Show every file the build touched
        run: |
          echo "── 생성 결과로 바뀐 파일 전체 ──"
          git status --porcelain share | sed 's/^/  /'
          echo "합계: $(git status --porcelain share | wc -l) 개"

      - name: Commit updated share pages
        env:
          SITE_IDS: ${{ inputs.site_ids }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${SITE_IDS}" ]; then
            echo "커밋 대상 ID: ${SITE_IDS}"
            for id in ${SITE_IDS}; do
              case "${id}" in
                ''|*[!0-9]*) echo "탐조지 ID 가 숫자가 아닙니다: ${id}"; exit 1 ;;
              esac
              git add -- "share/${id}/index.html" "share/og/${id}.png"
            done
            # 지정하지 않은 파일은 되돌려 러너에도 남기지 않는다.
            git checkout -- share
          else
            echo "커밋 대상: 바뀐 파일 전체"
            git add share
          fi
          if git diff --cached --quiet; then
            echo "No share page changes to commit."
            exit 0
          fi
          echo "── 실제 커밋 대상 ──"
          git diff --cached --name-only | sed 's/^/  /'
          echo "합계: $(git diff --cached --name-only | wc -l) 개"
          git diff --cached --stat
          # 스테이지에 담지 않은 변경(수정분·새 파일)이 남아 있으면 안 된다.
          # git status 는 스테이지된 것도 함께 보여 주므로 미스테이지분만 따로 본다.
          leftover="$(git diff --name-only -- share; git ls-files --others --exclude-standard -- share)"
          if [ -n "${leftover}" ]; then
            echo "커밋 대상 밖에 남은 변경이 있습니다:"
            echo "${leftover}" | sed 's/^/  /'
            exit 1
          fi
          git commit -m "chore: rebuild share pages"
          for attempt in 1 2 3; do
            # set -e 아래에서 한 번의 pull 실패로 재시도가 끊기지 않게 한다.
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
