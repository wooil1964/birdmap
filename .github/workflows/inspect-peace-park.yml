name: Inspect Peace Park site settings
on:
  push:
    branches:
      - feature/peace-park-spots-20260919
    paths:
      - .github/workflows/inspect-peace-park.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect nearby runtime sites and assertions
        run: |
          python3 - <<'PY'
          import sys,math,re
          sys.path.insert(0,'.github/scripts')
          from site_data import load_runtime_sites,load_worker_sites
          sites=load_runtime_sites(); worker=load_worker_sites()
          print('SITE_COUNT',len(sites),'WORKER_COUNT',len(worker),'MAX_ID',max(int(s['id']) for s in sites))
          lat,lon=37.5642583333,126.8920861111
          near=sorted(sites,key=lambda s:(float(s['lat'])-lat)**2+(float(s['lon'])-lon)**2)
          for s in near[:7]:
            print('NEARBY',repr(s))
          index=open('index.html',encoding='utf-8').read()
          for key in ('var siteData=','siteData=siteData.concat(','var siteSpotData=','function syncSiteSpots('):
            start=index.find(key);print('INDEX_ANCHOR',repr(key),start,repr(index[start:start+450]))
          for path in ('.github/scripts/test_weather.py','.github/scripts/test_tide.py','.github/scripts/test_weekly_recommendation.mjs'):
            text=open(path,encoding='utf-8').read().splitlines()
            for i,line in enumerate(text):
              if any(k in line for k in ('189','188','siteCount','commonIdCount','unavailableSiteCount')):
                print('TEST_ASSERT',path,i+1,line[:240])
          PY