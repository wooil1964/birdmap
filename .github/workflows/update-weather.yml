name: Update birding weather four times daily

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/update_weather.py"
      - ".github/scripts/site_data.py"
      - ".github/scripts/test_weather.py"
      - ".github/scripts/validate_weather.py"
      - "weather_rules.json"
      - "weather-proxy/src/sites.js"
      - "weather-proxy/test/**"
      - "index.html"
      - ".github/workflows/update-weather.yml"
  schedule:
    # GitHub Actions cron uses UTC: 21/01/05/09 UTC = 06/10/14/18 KST.
    - cron: "17 21 * * *"
    - cron: "17 1 * * *"
    - cron: "17 5 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: birdmap-data-refresh
  cancel-in-progress: false

jobs:
  inspect-windy:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[inspect-windy]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Inspect one Windy GFS atmospheric response
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python .github/scripts/inspect_windy_forecast.py

  update-weather:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[inspect-windy]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check updater syntax
        run: |
          python -m py_compile .github/scripts/update_weather.py .github/scripts/site_data.py
          python .github/scripts/test_weather.py
          node --test weather-proxy/test/*.test.mjs

      - name: Build weather_today.json
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
        run: python .github/scripts/update_weather.py

      - name: Validate weather_today.json
        run: python .github/scripts/validate_weather.py

      - name: Commit updated weather
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather_today.json
          if git diff --cached --quiet; then
            echo "No weather changes to commit."
            exit 0
          fi
          git commit -m "chore: update birding weather"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
