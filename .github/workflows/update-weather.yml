name: Update birding weather four times daily

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/update_weather.py"
      - ".github/scripts/site_data.py"
      - ".github/scripts/test_weather.py"
      - ".github/scripts/validate_weather.py"
      - ".github/scripts/validate_weather_week.py"
      - "weather_rules.json"
      - "weather-proxy/src/sites.js"
      - "weather-proxy/test/**"
      - "index.html"
      - ".github/workflows/update-weather.yml"
  schedule:
    # GitHub Actions cron uses UTC. 15:20 UTC is 00:20 KST: it refills the daily
    # file right after midnight, when the saved date has just gone stale. The
    # 00:05 KST tide run shares birdmap-data-refresh, so it finishes first.
    - cron: "20 15 * * *"
    # 05:35 KST, before the 06:05 KST tide refresh in the same group.
    - cron: "35 20 * * *"
    - cron: "17 1 * * *"
    - cron: "17 5 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: birdmap-data-refresh
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check updater syntax
        run: |
          python -m py_compile .github/scripts/update_weather.py .github/scripts/site_data.py .github/scripts/validate_weather_week.py
          python .github/scripts/test_weather.py
          node --test weather-proxy/test/*.test.mjs

      - name: Build weather_today.json and weather_week.json
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
        run: python .github/scripts/update_weather.py

      - name: Validate weather_today.json and weather_week.json
        run: |
          python .github/scripts/validate_weather.py
          python .github/scripts/validate_weather_week.py

      - name: Commit updated weather
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather_today.json weather_week.json
          if git diff --cached --quiet; then
            echo "No weather changes to commit."
            exit 0
          fi
          git commit -m "chore: update birding weather"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
