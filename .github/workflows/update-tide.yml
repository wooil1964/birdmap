name: Update daily birding tides

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/update_tide.py"
      - ".github/scripts/audit_tide_health.py"
      - ".github/scripts/build_tide_station_mapping.py"
      - ".github/scripts/tide_official_stations.json"
      - ".github/scripts/test_tide.py"
      - "tide_station_mapping.json"
      - ".github/workflows/update-tide.yml"
      - "data/birdmap_latest_v24_MasterDB_조석연동_업데이트용.xlsx"
  schedule:
    # GitHub Actions cron uses UTC. 15:05 UTC is 00:05 KST the following day.
    - cron: "5 15 * * *"
    # Backup refresh: 21:05 UTC is 06:05 KST, preventing stale daily tide data if the midnight run is missed or conflicts.
    - cron: "5 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: birdmap-data-refresh
  cancel-in-progress: false

jobs:
  update-tides:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check updater syntax
        run: python -m py_compile .github/scripts/build_tide_station_mapping.py .github/scripts/update_tide.py .github/scripts/audit_tide_health.py

      - name: Test tide reliability
        run: python -m unittest discover -s .github/scripts -p "test_tide.py"

      - name: Validate curated official station mapping
        run: python .github/scripts/build_tide_station_mapping.py

      - name: Validate station mapping
        run: python -m json.tool tide_station_mapping.json > /dev/null

      - name: Build tide_today.json
        env:
          KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
        run: python .github/scripts/update_tide.py

      - name: Validate tide_today.json
        run: python -m json.tool tide_today.json > /dev/null

      - name: Check tide_today freshness
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          kst = timezone(timedelta(hours=9))
          today = datetime.now(kst).strftime("%Y-%m-%d")
          data = json.loads(Path("tide_today.json").read_text(encoding="utf-8"))

          if data.get("date") != today:
            raise SystemExit(f"tide_today.json date mismatch: expected {today}, got {data.get('date')}")

          tomorrow = (datetime.now(kst) + timedelta(days=1)).strftime("%Y-%m-%d")
          if data.get("tomorrowDate") != tomorrow:
            raise SystemExit("tomorrowDate mismatch")
          for site in data["sites"].values():
            if site.get("date") != today or site.get("tomorrow", {}).get("date") != tomorrow:
              raise SystemExit("per-site prediction date mismatch")
          if data.get("siteCount") != data.get("targetSiteCount"):
            raise SystemExit("missing tide-enabled sites")

          print(f"tide_today.json is fresh: {today}, successCount={data.get('successCount')}")
          PY

      - name: Build tide health report
        if: always()
        run: python .github/scripts/audit_tide_health.py

      - name: Validate tide_health.json
        if: always()
        run: python -m json.tool tide_health.json > /dev/null

      - name: Upload tide diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tide-diagnostics
          path: |
            tide_today.json
            tide_health.json
          retention-days: 7

      - name: Commit updated tides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tide_station_mapping.json tide_today.json tide_health.json
          if git diff --cached --quiet; then
            echo "No tide changes to commit."
            exit 0
          fi
          git commit -m "chore: update daily birding tides"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
