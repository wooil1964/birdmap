function localDateString() {
  var now = new Date();
  return (
    now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0')

}

function activeNotice(item) {

  return (
    item.published !== false &&
    (item.start || '0000-01-01') <= today &&
    today <= (item.end || '9999-12-31')

  card.appendChild(title);

  var date = document.createElement('div');
  date.className = 'noticeDate';
  date.textContent =
    (item.start || '') +
    ((item.start && item.end) ? ' ~ ' : '') +
    (item.end || '');
  card.appendChild(date);

  var content = document.createElement('div');
  content.className = 'noticeContent';
  content.textContent = item.content || '';
  card.appendChild(content);

  if (item.link) {
    var link = document.createElement('a');
    link.className = 'noticeLink';
    link.href = item.link;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = item.linkText || '자세히 보기';
    card.appendChild(link);
  }

  return card;
}

  fetch('./notices.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(response) {
      if (!response.ok) throw new Error();
      return response.json();
    })
    .then(function(data) {
      var list = document.getElementById('noticeList');
      var notices = (Array.isArray(data) ? data : [])
        .filter(activeNotice)
        .sort(function(a, b) {
          return String(b.start || '').localeCompare(String(a.start || ''));
        });

      list.innerHTML = '';
      document.getElementById('noticeBadge').textContent = notices.length;

      if (!notices.length) {
        list.textContent = '현재 게시 중인 기획글이 없습니다.';
        return;
      }

      notices.slice(0, 5).forEach(function(item) {
        list.appendChild(noticeCard(item));
      });
    })
    .catch(function() {
      document.getElementById('noticeBadge').textContent = '!';
      document.getElementById('noticeList').textContent =
        '기획글 파일을 불러오지 못했습니다.';
    });
}

document.getElementById('searchBox')
  .addEventListener('keydown', function(event) {
    if (event.key === 'Enter') searchSite();
  });

window.addEventListener('load', function() {
  setTimeout(function() {
    rebuildMarkerRegistry();
    applyFilters(false);
    loadNotices();
  }, 300);
});
