<script>
(function(){
 const sites=window.SITES||[];
 const panel=document.getElementById('panel');
 const toggleButton=document.getElementById('toggle');
 const mobileMode=window.matchMedia('(max-width:700px)').matches;

 if(mobileMode){
   panel.classList.remove('open');
   toggleButton.textContent='필터 보기';
 }else{
   panel.classList.remove('panel-hidden');
   toggleButton.textContent='필터 숨기기';
 }

 toggleButton.onclick=function(){
   if(window.matchMedia('(max-width:700px)').matches){
     panel.classList.toggle('open');
     this.textContent=panel.classList.contains('open')?'필터 숨기기':'필터 보기';
   }else{
     panel.classList.toggle('panel-hidden');
     this.textContent=panel.classList.contains('panel-hidden')?'필터 보이기':'필터 숨기기';
   }
 };

 function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
 function norm(v){return String(v||'').toLowerCase().replace(/\s+/g,'').replace(/[·.,ㆍ]/g,'');}
 function selectedSeasons(){return [...document.querySelectorAll('.season:checked')].map(x=>x.value);}
 function passes(s){
   const ss=selectedSeasons();
   if(!s.seasons.some(x=>ss.includes(x))) return false;
   if(rareOnly.checked&&!s.rare)return false;
   if(mijoOnly.checked&&!s.mijo)return false;
   if(islandOnly.checked&&!s.island)return false;
   if(pelagicOnly.checked&&!s.pelagic)return false;
   if(transitOnly.checked&&s.transit!=='상')return false;
   if(recommendOnly.checked&&s.rating!=='★★★★★')return false;
   return true;
 }
 function details(s){
   const url='https://map.naver.com/v5/search/'+encodeURIComponent(s.naverQuery);
   return '<div class="popup"><h3>'+esc(s.name)+'</h3>'+
   '<b>지역:</b> '+esc(s.province)+' '+esc(s.district)+'<br>'+
   '<b>환경:</b> '+esc(s.env)+'<br><b>추천계절:</b> '+esc(s.recommendedSeason)+'<br>'+
   '<b>대표종:</b> '+esc(s.birds)+'<br><b>접근:</b> '+esc(s.access)+' · <b>교통:</b> '+esc(s.transit)+'<br>'+
   '<b>주차:</b> '+esc(s.parking)+' · <b>화장실:</b> '+esc(s.toilet)+'<br>'+
   '<b>숙박:</b> '+esc(s.lodging)+'<br><b>선박:</b> '+esc(s.ship)+'<br>'+
   '<b>추천도:</b> '+esc(s.rating)+'<br><b>주의:</b> '+esc(s.caution)+'<br>'+
   '<a href="'+url+'" target="_blank">네이버지도에서 보기</a></div>';
 }

 let map=null, layer=null, markerItems=[];
 function binoSvg(){
   return '<svg width="38" height="48" viewBox="0 0 38 48" xmlns="http://www.w3.org/2000/svg">'+
   '<path d="M19 47C16 40 4 31 4 19C4 8.5 10.7 2 19 2s15 6.5 15 17c0 12-12 21-15 28z" fill="#2f78b7" stroke="#174b75" stroke-width="2"/>'+
   '<g transform="translate(7,11)" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'+
   '<circle cx="6" cy="10" r="5"/><circle cx="18" cy="10" r="5"/>'+
   '<path d="M10.5 8h3M7 4V1h4v5M17 4V1h4v5"/>'+
   '</g></svg>';
 }

 function initLeaflet(){
   if(typeof L==='undefined') return false;
   map=L.map('map',{center:[36.25,127.75],zoom:7,minZoom:5});
   L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
   layer=L.layerGroup().addTo(map);
   const icon=L.divIcon({className:'binoIcon',html:binoSvg(),iconSize:[38,48],iconAnchor:[19,47],popupAnchor:[0,-43]});
   markerItems=sites.map(s=>{
     const m=L.marker([s.lat,s.lon],{icon}).bindPopup(details(s),{maxWidth:460}).bindTooltip(s.name,{sticky:true});
     m.addTo(layer); return {site:s,marker:m};
   });
   map.fitBounds([[32.8,124.0],[39.2,132.2]]);
   return true;
 }

 function project(s){
   const minLon=124,maxLon=132.2,minLat=32.8,maxLat=39.2;
   return {x:80+(s.lon-minLon)/(maxLon-minLon)*540,y:810-(s.lat-minLat)/(maxLat-minLat)*700};
 }
 function initFallback(){
   document.getElementById('map').style.display='none';
   document.getElementById('fallbackMap').style.display='block';
   const g=document.getElementById('svgMarkers');
   g.innerHTML='';
   sites.forEach((s,i)=>{
     const p=project(s);
     const group=document.createElementNS('http://www.w3.org/2000/svg','g');
     group.setAttribute('class','svg-marker');
     group.setAttribute('data-index',i);
     group.setAttribute('transform','translate('+(p.x-12)+','+(p.y-25)+') scale(.72)');
     group.innerHTML='<path d="M19 47C16 40 4 31 4 19C4 8.5 10.7 2 19 2s15 6.5 15 17c0 12-12 21-15 28z" fill="#2f78b7" stroke="#174b75" stroke-width="2"/>'+
                     '<g transform="translate(7,11)" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'+
                     '<circle cx="6" cy="10" r="5"/><circle cx="18" cy="10" r="5"/>'+
                     '<path d="M10.5 8h3M7 4V1h4v5M17 4V1h4v5"/></g>';
     group.onclick=function(){
       const box=document.getElementById('fallbackInfo');
       box.innerHTML=details(s); box.style.display='block';
     };
     g.appendChild(group);
   });
 }
 const leafletReady=initLeaflet();
 if(!leafletReady) initFallback();

 function apply(){
   let n=0;
   if(layer){
     layer.clearLayers();
     markerItems.forEach(x=>{if(passes(x.site)){x.marker.addTo(layer);n++;}});
   } else {
     document.querySelectorAll('.svg-marker').forEach((el,i)=>{
       const show=passes(sites[i]); el.style.display=show?'':'none'; if(show)n++;
     });
   }
   document.getElementById('count').textContent='표시 탐조지: '+n+' / '+sites.length;
 }
 function search(){
   const q=norm(searchBox.value);
   if(!q){apply();return;}
   const found=sites.map((s,i)=>({s,i})).filter(x=>passes(x.s)&&norm([x.s.name,x.s.province,x.s.district,x.s.env,x.s.birds].join(' ')).includes(q));
   if(!found.length){alert('검색 결과가 없습니다.');return;}
   const f=found[0];
   if(map){map.setView([f.s.lat,f.s.lon],12);markerItems[f.i].marker.openPopup();}
   else {
     const box=document.getElementById('fallbackInfo'); box.innerHTML=details(f.s);box.style.display='block';
   }
   document.getElementById('count').textContent='검색 결과: '+found.length+'개';
   if(innerWidth<701){panel.classList.remove('open');document.getElementById('toggle').textContent='필터 보기';}
 }
 searchBtn.onclick=search;
 resetBtn.onclick=function(){
   searchBox.value='';document.querySelectorAll('.season').forEach(x=>x.checked=true);
   ['rareOnly','mijoOnly','islandOnly','pelagicOnly','transitOnly','recommendOnly'].forEach(id=>document.getElementById(id).checked=false);
   apply();if(map)map.fitBounds([[32.8,124.0],[39.2,132.2]]);
 };
 document.querySelectorAll('#panel input[type=checkbox]').forEach(x=>x.onchange=apply);
 searchBox.onkeydown=e=>{if(e.key==='Enter')search();};
 apply();

 // Leaflet가 로드됐지만 타일이 전혀 나타나지 않는 경우 5초 뒤 내장 지도 전환 버튼 제공
 if(map){
   setTimeout(function(){
     const pane=document.querySelector('.leaflet-tile-pane');
     if(!pane || pane.querySelectorAll('img.leaflet-tile-loaded').length===0){
       map.remove(); map=null; layer=null; initFallback(); apply();
     }
   },5000);
 }
})();
</script>
