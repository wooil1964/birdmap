html,body{margin:0;height:100%;font-family:Arial,'Malgun Gothic',sans-serif}
#layout{display:flex;height:100%}
#side{width:360px;max-width:42vw;box-sizing:border-box;padding:12px;background:#fff;overflow:auto;border-right:1px solid #bbb}
#map{flex:1;height:100%}

.site:hover{background:#f4f7f4}
.site b{font-size:14px}
.meta{font-size:12px;color:#555;margin-top:3px}
.tag{display:inline-block;border:1px solid #999;border-radius:10px;padding:1px 6px;margin:2px 3px 0 0;font-size:11px}
.popup{width:390px;max-width:65vw;line-height:1.55}
.popup h3{margin:0 0 6px}
.notice{padding:8px;background:#fff5d6;border:1px solid #d8b44a;font-size:12px;margin-bottom:8px}
@media(max-width:700px){
 #layout{display:block}
 #side{position:absolute;z-index:1000;width:310px;max-width:88vw;height:55%;border:1px solid #888}
 #map{height:100%}
 input[type=text]{width:190px}
}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map = null;
let layer = null;
let markers = [];

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function norm(v){
  return String(v ?? '').toLowerCase().replace(/\s+/g,'').replace(/[·.,ㆍ]/g,'');
}
function colorOf(s){
  if(s.mijo) return '#d7191c';
  if(s.rare) return '#f28e2b';
  if(s.pelagic) return '#2455a4';
  if(s.island) return '#7a3db8';
  if((s.env||'').includes('산')) return '#287a3d';
  return '#268bd2';
}
function passes(s){
  const seasons=[...document.querySelectorAll('.season:checked')].map(x=>x.value);
  if(!s.seasons.some(x=>seasons.includes(x))) return false;
  if(document.getElementById('rare').checked && !s.rare) return false;
  if(document.getElementById('mijo').checked && !s.mijo) return false;
  if(document.getElementById('island').checked && !s.island) return false;
  if(document.getElementById('pelagic').checked && !s.pelagic) return false;
  if(document.getElementById('transit').checked && !s.publicTransitHigh) return false;
  if(document.getElementById('recommend').checked && !s.recommend5) return false;
  const q=norm(document.getElementById('searchBox').value);
  if(q && !norm(s.searchText).includes(q)) return false;
  return true;
}
function popup(s){
  const url='https://map.naver.com/v5/search/'+encodeURIComponent(s.naverQuery);
  return `<div class="popup"><h3>${esc(s.name)}</h3>
  <b>지역:</b> ${esc(s.province)} ${esc(s.district)}<br>
  <b>환경:</b> ${esc(s.env)}<br>
  <b>추천계절:</b> ${esc(s.recommendedSeason)}<br>
  <b>대표종:</b> ${esc(s.birds)}<br>
  <b>접근:</b> ${esc(s.access)} · <b>대중교통:</b> ${esc(s.transit)}<br>
  <b>주차:</b> ${esc(s.parking)} · <b>화장실:</b> ${esc(s.toilet)}<br>
  <b>숙박:</b> ${esc(s.lodging)}<br>
  <b>선박:</b> ${esc(s.ship)}<br>
  <b>추천도:</b> ${esc(s.rating)}<br>
  <b>주의:</b> ${esc(s.caution)}<br>
  <a href="${url}" target="_blank">네이버지도에서 보기</a></div>`;
}
function initMap(){
  if(typeof L==='undefined'){
    document.getElementById('map').innerHTML='<div style="padding:30px">지도 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하십시오. 탐조지 데이터는 왼쪽 목록에서 확인할 수 있습니다.</div>';
    return;
  }
  map=L.map('map').setView([36.25,127.75],7);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  layer=L.layerGroup().addTo(map);
  markers=siteData.map(s=>{
    const m=L.circleMarker([s.lat,s.lon],{
      radius:s.mijo?8:6,
      color:'#333',
      weight:1,
      fillColor:colorOf(s),
      fillOpacity:.9
    }).bindPopup(popup(s),{maxWidth:460}).bindTooltip(s.name);
    return {site:s,marker:m};
  });
}
function applyAll(){
  const filtered=siteData.filter(passes);
  document.getElementById('count').textContent=`표시 탐조지: ${filtered.length} / ${siteData.length}`;
  document.getElementById('list').innerHTML=filtered.map((s,i)=>{
    let tags=[];
    if(s.rare) tags.push('희귀조');
    if(s.mijo) tags.push('미조');
    if(s.island) tags.push('섬');
    if(s.pelagic) tags.push('선상');
    return `<div class="site" onclick="focusSite('${String(s.id).replaceAll("'","\\'")}')">
      <b>${esc(s.name)}</b>
      <div class="meta">${esc(s.province)} ${esc(s.district)} · ${esc(s.env)}</div>
      <div class="meta">${esc(s.birds)}</div>
      <div>${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </div>`;
  }).join('');
  if(layer){
    layer.clearLayers();
    markers.forEach(x=>{ if(passes(x.site)) x.marker.addTo(layer); });
  }
}
function focusSite(id){
  const x=markers.find(v=>String(v.site.id)===String(id));
  if(x && map){map.setView(x.marker.getLatLng(),12);x.marker.openPopup();}
}
function resetAll(){
  document.getElementById('searchBox').value='';
  document.querySelectorAll('.season').forEach(x=>x.checked=true);
  ['rare','mijo','island','pelagic','transit','recommend'].forEach(id=>document.getElementById(id).checked=false);
  applyAll();
  if(map) map.fitBounds([[32.8,124.0],[39.2,132.2]]);
}
document.querySelectorAll('input').forEach(x=>x.addEventListener('change',applyAll));
document.getElementById('searchBox').addEventListener('keydown',e=>{if(e.key==='Enter')applyAll();});
initMap();
applyAll();
if(map) map.fitBounds([[32.8,124.0],[39.2,132.2]]);
</script>
