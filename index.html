function fitToSites(sites){if(!sites.length)return;if(sites.length===1){map_462e73141ff41834dcbfa163432ac655.setView([sites[0].lat,sites[0].lon],10);var marker=markerRegistry[markerKey(sites[0])];if(marker)marker.openPopup();}else{map_462e73141ff41834dcbfa163432ac655.fitBounds(sites.map(function(site){return[site.lat,site.lon];}),{padding:[30,30]});}}
