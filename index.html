var markerRegistry = {};
var activeSearch = '';

function markerKey(site) {
  return site.id + '|' + site.lat + '|' + site.lon;
}

function normalizeQuery(text) {
  return String(text || '').toLowerCase()
    .replace(/[·\.,\/\(\)\[\]\-–—_]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function toggleBirdmapPanel() {
  var panel = document.getElementById('birdmapPanel');
  var button = document.getElementById('togglePanelBtn');

  if (panel.style.display === 'none') {
    panel.style.display = 'block';
    button.innerText = '필터 숨기기';
  } else {
    panel.style.display = 'none';
    button.innerText = '필터 보이기';
  }
}

function rebuildMarkerRegistry() {
  markerRegistry = {};
  siteData.forEach(function(site) {
    if (window[site.markerVar]) {
      markerRegistry[markerKey(site)] = window[site.markerVar];
    }
  });
}

function selectedSeasons() {
  var result = [];
  document.querySelectorAll('.seasonFilter:checked').forEach(function(box) {
    result.push(box.value);
  });
  return result;
}

function sitePasses(site) {
  var seasons = selectedSeasons();
  var seasonMatch =
    site.seasons.length === 0 ||
    site.seasons.some(function(season) {
      return seasons.includes(season);
    });

  if (!seasonMatch) return false;
  if (document.getElementById('overseasOnly').checked && !site.overseas) return false;
  if (document.getElementById('rareOnly').checked && !site.rare) return false;
  if (document.getElementById('mijoOnly').checked && !site.mijo) return false;
  if (document.getElementById('islandOnly').checked && !site.island) return false;
  if (document.getElementById('pelagicOnly').checked && !site.pelagic) return false;
  if (document.getElementById('transitOnly').checked && !site.publicTransitHigh) return false;
  if (document.getElementById('recommendOnly').checked && !site.recommend5) return false;

  if (activeSearch) {
    var query = activeSearch;
    var match =
      normalizeQuery(site.id).includes(query) ||
      normalizeQuery(site.name).includes(query) ||
      normalizeQuery(site.country).includes(query) ||
      normalizeQuery(site.region).includes(query) ||
      normalizeQuery(site.sido).includes(query) ||
      normalizeQuery(site.sigungu).includes(query) ||
      normalizeQuery(site.env).includes(query) ||
      normalizeQuery(site.birds).includes(query) ||
      site.searchText.includes(query);

    if (!match) return false;
  }

  return true;
}

function fitToSites(sites) {
  if (!sites.length) return;

  if (sites.length === 1) {
    map_daea704e9303709efce2c07f8dfc14d1.setView([sites[0].lat, sites[0].lon], 10);
    var marker = markerRegistry[markerKey(sites[0])];
    if (marker) marker.openPopup();
  } else {
    map_daea704e9303709efce2c07f8dfc14d1.fitBounds(
      sites.map(function(site) {
        return [site.lat, site.lon];
      }),
      {padding:[30,30]}
    );
  }
}

function applyFilters(fitAfter) {
  rebuildMarkerRegistry();

  var count = 0;
  var visibleSites = [];

  siteData.forEach(function(site) {
    var marker = markerRegistry[markerKey(site)];
    if (!marker) return;

    if (sitePasses(site)) {
      if (!map_daea704e9303709efce2c07f8dfc14d1.hasLayer(marker)) marker.addTo(map_daea704e9303709efce2c07f8dfc14d1);
      count++;
      visibleSites.push(site);
    } else if (map_daea704e9303709efce2c07f8dfc14d1.hasLayer(marker)) {
      map_daea704e9303709efce2c07f8dfc14d1.removeLayer(marker);
    }
  });

  document.getElementById('resultCount').innerText =
    (activeSearch ? '검색 결과: ' + activeSearch + ' · ' : '표시 중: ') +
    count + ' / ' + siteData.length + '개 권역';

  if (fitAfter) fitToSites(visibleSites);
}

function searchSite() {
  var query = normalizeQuery(document.getElementById('searchBox').value);
  if (!query) return;

  activeSearch = query;
  applyFilters(true);

  if (!siteData.filter(sitePasses).length) {
    alert('검색 결과가 없습니다.');
  }
}

function resetFilters() {
  document.querySelectorAll('.seasonFilter').forEach(function(box) {
    box.checked = true;
  });

  [
    'overseasOnly', 'rareOnly', 'mijoOnly',
    'islandOnly', 'pelagicOnly',
    'transitOnly', 'recommendOnly'
  ].forEach(function(id) {
    document.getElementById(id).checked = false;
  });

  document.getElementById('searchBox').value = '';
  activeSearch = '';
  applyFilters(false);
  map_daea704e9303709efce2c07f8dfc14d1.fitBounds([[32.8,124.0],[39.2,132.2]]);
}

function toggleNoticePanel(forceOpen) {
  var panel = document.getElementById('noticePanel');
  var open =
    typeof forceOpen === 'boolean'
      ? forceOpen
      : panel.style.display !== 'block';

  panel.style.display = open ? 'block' : 'none';

  if (open && window.innerWidth <= 700) {
    document.getElementById('birdmapPanel').style.display = 'none';
    document.getElementById('togglePanelBtn').innerText = '필터 보이기';
  }
}

function localDateString() {
  var now = new Date();
  return (
    now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0')
  );
}

function activeNotice(item) {
  var today = localDateString();
  return (
    item.published !== false &&
    (item.start || '0000-01-01') <= today &&
    today <= (item.end || '9999-12-31')
  );
}

function noticeCard(item) {
  var card = document.createElement('div');
  card.className = 'noticeCard';

  var title = document.createElement('div');
  title.className = 'noticeTitle';
  title.textContent = item.title || '탐조 기획';
  card.appendChild(title);

  var date = document.createElement('div');
  date.className = 'noticeDate';
  date.textContent =
    (item.start || '') +
    ((item.start && item.end) ? ' ~ ' : '') +
    (item.end || '');
  card.appendChild(date);

  var content = document.createElement('div');
  content.className = 'noticeContent';
  content.textContent = item.content || '';
  card.appendChild(content);

  if (item.link) {
    var link = document.createElement('a');
    link.className = 'noticeLink';
    link.href = item.link;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = item.linkText || '자세히 보기';
    card.appendChild(link);
  }

  return card;
}

function loadNotices() {
  fetch('./notices.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(response) {
      if (!response.ok) throw new Error();
      return response.json();
    })
    .then(function(data) {
      var list = document.getElementById('noticeList');
      var notices = (Array.isArray(data) ? data : [])
        .filter(activeNotice)
        .sort(function(a, b) {
          return String(b.start || '').localeCompare(String(a.start || ''));
        });

      list.innerHTML = '';
      document.getElementById('noticeBadge').textContent = notices.length;

      if (!notices.length) {
        list.textContent = '현재 게시 중인 기획글이 없습니다.';
        return;
      }

      notices.slice(0, 5).forEach(function(item) {
        list.appendChild(noticeCard(item));
      });
    })
    .catch(function() {
      document.getElementById('noticeBadge').textContent = '!';
      document.getElementById('noticeList').textContent =
        '기획글 파일을 불러오지 못했습니다.';
    });
}

document.getElementById('searchBox')
  .addEventListener('keydown', function(event) {
    if (event.key === 'Enter') searchSite();
  });

window.addEventListener('load', function() {
  setTimeout(function() {
    rebuildMarkerRegistry();
    applyFilters(false);
    loadNotices();
  }, 300);
});
</script>
