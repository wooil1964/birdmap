var markerRegistry = {};
var activeSearch = '';

function toggleBirdmapPanel() {
  var p=document.getElementById('birdmapPanel');
  var b=document.getElementById('togglePanelBtn');
  if(p.style.display==='none'){p.style.display='block';b.innerText='필터 숨기기';}
  else{p.style.display='none';b.innerText='필터 보이기';}
}

function normalizeQuery(s) {
  return String(s||'').toLowerCase()
    .replace(/[·\.,\/\(\)\[\]\-–—_]+/g,' ')
    .replace(/\s+/g,' ').trim();
}

function rebuildMarkerRegistry() {
  markerRegistry={};
  siteData.forEach(function(site) {
    if(window[site.markerVar]) markerRegistry[site.name]=window[site.markerVar];
  });
}

function selectedSeasons() {
  var result=[];
  document.querySelectorAll('.seasonFilter:checked').forEach(function(cb){
    result.push(cb.value);
  });
  return result;
}

function sitePasses(site) {
  var seasons=selectedSeasons();
  var seasonMatch=(site.seasons.length===0)||
    site.seasons.some(function(s){return seasons.includes(s);});
  if(!seasonMatch) return false;
  if(document.getElementById('rareOnly').checked&&!site.rare) return false;
  if(document.getElementById('mijoOnly').checked&&!site.mijo) return false;
  if(document.getElementById('islandOnly').checked&&!site.island) return false;
  if(document.getElementById('pelagicOnly').checked&&!site.pelagic) return false;
  if(document.getElementById('transitOnly').checked&&!site.publicTransitHigh) return false;
  if(document.getElementById('recommendOnly').checked&&!site.recommend5) return false;

  if(activeSearch) {
    var q=activeSearch;
    var match=
      normalizeQuery(site.name).includes(q)||
      normalizeQuery(site.region).includes(q)||
      normalizeQuery(site.sido).includes(q)||
      normalizeQuery(site.sigungu).includes(q)||
      normalizeQuery(site.env).includes(q)||
      normalizeQuery(site.birds).includes(q)||
      site.searchText.includes(q);
    if(!match) return false;
  }
  return true;
}

function fitToSites(sites) {
  if(!sites.length) return;
  if(sites.length===1) {
    map_ae38d8d3e6862e194481b1022c4538ca.setView([sites[0].lat,sites[0].lon],11);
    var marker=markerRegistry[sites[0].name];
    if(marker) marker.openPopup();
  } else {
    map_ae38d8d3e6862e194481b1022c4538ca.fitBounds(
      sites.map(function(s){return [s.lat,s.lon];}),
      {padding:[30,30]}
    );
  }
}

function applyFilters(fitAfter) {
  rebuildMarkerRegistry();
  var count=0;
  var sites=[];

  siteData.forEach(function(site) {
    var marker=markerRegistry[site.name];
    if(!marker) return;

    if(sitePasses(site)) {
      if(!map_ae38d8d3e6862e194481b1022c4538ca.hasLayer(marker)) marker.addTo(map_ae38d8d3e6862e194481b1022c4538ca);
      count++;
      sites.push(site);
    } else {
      if(map_ae38d8d3e6862e194481b1022c4538ca.hasLayer(marker)) map_ae38d8d3e6862e194481b1022c4538ca.removeLayer(marker);
    }
  });

  document.getElementById('resultCount').innerText=
    (activeSearch?'검색 결과: '+activeSearch+' · ':'표시 중: ')+
    count+' / '+siteData.length+'개 권역';

  if(fitAfter) fitToSites(sites);
}

function searchSite() {
  var q=normalizeQuery(document.getElementById('searchBox').value);
  if(!q) return;
  activeSearch=q;
  applyFilters(true);

  if(siteData.filter(function(site){return sitePasses(site);}).length===0) {
    alert('검색 결과가 없습니다.');
  }
}

function resetFilters() {
  document.querySelectorAll('.seasonFilter').forEach(function(cb){cb.checked=true;});
  ['rareOnly','mijoOnly','islandOnly','pelagicOnly','transitOnly','recommendOnly']
    .forEach(function(id){document.getElementById(id).checked=false;});
  document.getElementById('searchBox').value='';
  activeSearch='';
  applyFilters(false);
}

document.getElementById('searchBox').addEventListener('keydown',function(e){
  if(e.key==='Enter') searchSite();
});

window.addEventListener('load',function(){
  setTimeout(function(){
    rebuildMarkerRegistry();
    applyFilters(false);
  },300);
});
</script>
