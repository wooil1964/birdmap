# 공개 제보 접수 Worker. 로그인 없이 누구나 호출하므로 Cloudflare Access 를 걸지 않는다.
# 관리자 기능은 이 Worker 에 없다(wrangler.admin.toml 참조).
#
#   npx wrangler deploy -c wrangler.public.toml
#
name = "birdmap-reports"
main = "src/public.js"
compatibility_date = "2026-07-03"
workers_dev = true
# 옛 version 의 preview URL 로 guard 없는 legacy 쓰기 경로에 닿지 않도록 끈다.
preview_urls = false

# 운영 기본값은 정본(dual-write) 모드다. 단계 전환은 배포 시 --var 로만 덮어쓴다.
# NORMAL(legacy, Turnstile redemption guard 없음)로 되돌리는 배포를 하지 않는다.
[vars]
FIELD_NEWS_RETIRED = "true"
# Strict publication contract. Deploy only after local migration and approved coordinated rollout.
REPORTS_PUBLICATION_REQUIRED = "true"
# 긴급 공개 읽기 차단. "true"면 위치·이력·검색·통계와 공개 권한 확인까지 503(no-store)으로 닫고
# 제보 접수·접수 상태·관리자 확인은 유지한다. 평소에는 "false". 차단판은 --var 로만 올린다.
REPORTS_PUBLIC_READS_CLOSED = "false"
ENVIRONMENT = "production"
REPORTS_WRITE_MODE = "CANONICAL_DUAL_WRITE"
REPORTS_DUAL_WRITE_ENABLED = "true"
REPORTS_CONFIRMATION_REQUIRED = "true"
REPORTS_SCHEMA_VERSION = "phase2a-0001"
REPORTS_ACTIVATION_ID = "phase2e-cutover-1"
REPORTS_RELEASE_ID = "public-phase2e-1"
REPORTS_PEER_RELEASE_ID = "admin-phase2e-1"
# 승인 전 공개는 코드에서도 차단한다. 기존 자료와 승인 절차는 유지한다.
REPORTS_PENDING_PUBLIC = "0"
# 일반종 자동 공개(미검증). 둘 다 "0"이면 현행 사전 승인제와 같다. 켜는 것은 별도 운영 승인 후 버전 전환으로 한다.
REPORTS_AUTO_PUBLIC = "0"
REPORTS_UNVERIFIED_READS = "0"
REPORTS_AUTO_PUBLIC_DAILY_MAX = "50"
REPORTS_REMOTE_VERIFIED = "true"
# 새 제보 관리자 메일 알림(src/notify.js). RESEND_API_KEY 시크릿이 없으면 보내지 않고 건너뛴다.
# 도메인 인증 전에는 보내는 주소가 onboarding@resend.dev, 받는 주소는 Resend 계정 이메일만 가능하다.
NOTIFY_EMAIL_TO = "wooil2000@gmail.com"
NOTIFY_EMAIL_FROM = "들뫼 탐조지도 <onboarding@resend.dev>"
ADMIN_PAGE_URL = "https://birdmap-reports-admin.wooil-birdmap.workers.dev/admin"

# 관리자 Worker 와 서로의 준비 상태(release·schema·mode)를 확인한다.
[[services]]
binding = "REPORTS_PEER"
service = "birdmap-reports-admin"

# 제보 데이터베이스. id 는 `wrangler d1 create birdmap-reports` 가 출력한 값으로 바꾼다.
[[d1_databases]]
binding = "REPORTS_DB"
database_name = "birdmap-reports"
database_id = "b48201cc-0abd-4a64-bb61-9dd2a7813d21"

# 시크릿(저장소에 커밋하지 않는다. `wrangler secret put -c wrangler.public.toml <이름>`):
#   TURNSTILE_SECRET_KEY  자동 등록 방지 토큰 검증용
#   REPORT_IP_SALT        IP 해시 솔트. 원본 IP 는 저장하지 않는다.
#   REPORTS_GATE_TOKEN    두 Worker 가 공유하는 내부 준비 상태 확인용 토큰
#   RESEND_API_KEY        새 제보 관리자 메일 알림(없으면 알림만 건너뛰고 접수는 그대로)
